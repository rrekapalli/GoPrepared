# GoPrepared — single LXC (nginx PWA + Spring Boot API). Override secrets in workspace .env

GOPREPARED_VMID=7003
GOPREPARED_CONTAINER_NAME=goprepared
GOPREPARED_HOST=goprepared.tailce422e.ts.net

# Clone from moneytree LXC base (SSH + Tailscale package + user raja)
GOPREPARED_CLONE_TEMPLATE=moneytree-lxc-base
CLONE_TEMPLATE_VMID=9001

GOPREPARED_CORES=2
GOPREPARED_MEMORY_MB=2048
GOPREPARED_ROOTFS_GB=16

UI_PORT=80
API_PORT=8080

GOPREPARED_WEB_ROOT=/var/www/goprepared
GOPREPARED_API_HOME=/opt/goprepared/go-prepared-api
GOPREPARED_CONTENT_ROOT=/opt/goprepared/go-prepared-content

LXC_ROOTFS_STORAGE=local-storage
