spring:
  application:
    name: go-prepared-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:goprepared}
    username: ${POSTGRES_USER:goprepared}
    password: ${POSTGRES_PASSWORD:goprepared}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}

server:
  port: ${API_PORT:8080}

goprepared:
  ai:
    provider: ${GOPREPARED_AI_PROVIDER:ollama}
    structured-output: true
    fallback-to-static: true
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars!!}
    expiration-ms: 86400000
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${GOPREPARED_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://goprepared.tailce422e.ts.net}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    com.goprepared: INFO
