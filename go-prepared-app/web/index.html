<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GoPrepared — Be Ready Anywhere. AI-powered preparation intelligence.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1565C0">
  <!-- Set to your Google OAuth Web client ID for google_sign_in on web (optional if using --dart-define=GOOGLE_CLIENT_ID) -->
  <meta name="google-signin-client_id" content="">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GoPrepared">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GoPrepared</title>
  <link rel="manifest" href="manifest.json">
  <!-- Required for Microsoft sign-in on web (aad_oauth / MSAL.js) -->
  <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.13.1/js/msal-browser.min.js"
    integrity="sha384-2Vr9MyareT7qv+wLp1zBt78ZWB4aljfCTMUrml3/cxm0W81ahmDOC6uyNmmn0Vrc"
    crossorigin="anonymous"></script>
  <script src="msalv2_goprepared.js"></script>
  <style>
    html, body {
      background: #ffffff;
      margin: 0;
      height: 100%;
    }
    /* Prevent accidental full-page text selection tint on Flutter web */
    body {
      user-select: none;
      -webkit-user-select: none;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #ffffff;
    }
    #splash img {
      width: 96px;
      height: 96px;
      border-radius: 22%;
    }
    #splash p {
      margin: 0;
      font: 600 12px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #616161;
    }
    flt-glass-pane textarea,
    flt-glass-pane input,
    textarea, input {
      user-select: text;
      -webkit-user-select: text;
    }
  </style>
</head>
<body>
  <!-- Capture Microsoft OAuth return before Flutter path URL strategy runs -->
  <script>
    (function () {
      function oauthStore() {
        try { return window.localStorage; } catch (e) { return window.sessionStorage; }
      }
      function readOAuth(key) {
        var s = oauthStore();
        var v = s.getItem(key);
        if (v) return v;
        try { return sessionStorage.getItem(key); } catch (e) { return null; }
      }
      function writeOAuth(key, value) {
        try { oauthStore().setItem(key, value); } catch (e) {}
        try { sessionStorage.setItem(key, value); } catch (e) {}
      }
      window.__gpOAuth = {
        hasOAuthParams: function (search, hash) {
          return /(?:^|[?&#])(code|error)=/.test(search || '') || /(?:^|[?&#])(code|error)=/.test(hash || '');
        },
        read: readOAuth,
        write: writeOAuth,
        isOAuthReturn: function () {
          var search = window.location.search || '';
          var hash = window.location.hash || '';
          return this.hasOAuthParams(search, hash) || !!readOAuth('gp_msal_return');
        }
      };

      try {
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        if (window.__gpOAuth.hasOAuthParams(search, hash)) {
          writeOAuth('gp_msal_return', search + hash);
          var path = window.location.pathname || '/';
          if (path !== '/auth' && path !== '/auth/') {
            window.history.replaceState(null, '', '/auth' + search + hash);
          }
        }
      } catch (e) {
        console.warn('[GoPrepared] OAuth URL capture skipped', e);
      }
    })();
  </script>
  <!-- Init MSAL before Flutter boot so handleRedirectPromise sees the auth code (Safari PWA) -->
  <script>
    (function () {
      window.__gpMsalEarlyInit = function () {
        return new Promise(function (resolve) {
          try {
            if (!window.__gpOAuth || !window.__gpOAuth.isOAuthReturn()) {
              resolve(false);
              return;
            }
            if (typeof aadOauth === 'undefined') {
              resolve(false);
              return;
            }

            function runInit(clientId, tenant, redirectUri) {
              if (!clientId || !tenant || !redirectUri) {
                resolve(false);
                return;
              }
              aadOauth.init({
                clientId: clientId,
                tenant: tenant,
                redirectUri: redirectUri,
                scope: 'openid profile offline_access email',
                isB2C: false,
                customParameters: '{}',
                cacheLocation: 'localStorage',
              });
              window.__gpOAuth.write('gp_msal_early_init', '1');
              resolve(true);
            }

            var clientId = window.__gpOAuth.read('gp_msal_client_id');
            var tenant = window.__gpOAuth.read('gp_msal_tenant_id');
            var redirectUri = window.__gpOAuth.read('gp_msal_redirect_uri') || (location.origin + '/auth');

            if (clientId && tenant) {
              runInit(clientId, tenant, redirectUri);
              return;
            }

            // iOS PWA may lose pre-redirect storage — load public OAuth config from API.
            fetch('/api/v1/auth/config', { cache: 'no-store' })
              .then(function (res) { return res.ok ? res.json() : null; })
              .then(function (cfg) {
                if (!cfg || !cfg.microsoftClientId) {
                  resolve(false);
                  return;
                }
                runInit(
                  cfg.microsoftClientId,
                  cfg.microsoftTenantId || 'common',
                  redirectUri
                );
              })
              .catch(function () { resolve(false); });
          } catch (e) {
            console.warn('[GoPrepared] MSAL early init skipped', e);
            resolve(false);
          }
        });
      };
    })();
  </script>
  <div id="splash" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">
    <p>Be Ready Anywhere</p>
  </div>
  <script>
    function removeSplash() {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    }
    window.addEventListener('flutter-first-frame', removeSplash);
    // Fallback if first frame never fires (incognito SW purge hang, CDN blocked, etc.)
    setTimeout(removeSplash, 12000);
  </script>
  <!--
    Version gate runs before flutter_bootstrap.js so a stale cached bootstrap
    cannot block PWA updates. See web/flutter_bootstrap.js for polling logic.
  -->
  <script>
    (function () {
      var VERSION_KEY = 'goprepared.app.version';
      var MIGRATION_KEY = 'goprepared.pwa.migrated-v3';

      function isLocalDev() {
        var h = location.hostname;
        if (h === 'localhost' || h === '127.0.0.1' || h === '[::1]') return true;
        // Flutter web dev server (see FLUTTER_WEB_PORT in .env)
        var p = location.port;
        return p === '51518' || p === '8080' || p === '5000' || p === '3000';
      }

      function withTimeout(promise, ms) {
        return Promise.race([
          promise,
          new Promise(function (resolve) { setTimeout(resolve, ms); }),
        ]);
      }

      function versionUrl() {
        return new URL('version.json', document.baseURI).toString();
      }

      function releaseLabel(data) {
        var label = data.version + '+' + data.build_number;
        if (data.build_id) label += '+' + data.build_id;
        return label;
      }

      function purgeClient() {
        var tasks = [];
        if ('serviceWorker' in navigator) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            })
          );
        }
        if ('caches' in window) {
          tasks.push(
            caches.keys().then(function (names) {
              return Promise.all(names.map(function (n) { return caches.delete(n); }));
            })
          );
        }
        return Promise.all(tasks);
      }

      function loadBootstrap() {
        if (window.__gpBootstrapLoaded) return;
        window.__gpBootstrapLoaded = true;
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js?t=' + Date.now();
        s.onerror = function () {
          console.error('[GoPrepared] flutter_bootstrap.js failed to load');
          removeSplash();
        };
        document.body.appendChild(s);
      }

      function startBootstrap() {
        var boot = function () { loadBootstrap(); };
        if (window.__gpMsalEarlyInit && window.__gpOAuth && window.__gpOAuth.isOAuthReturn()) {
          window.__gpMsalEarlyInit().finally(boot);
          return;
        }
        boot();
      }

      function fetchReleaseLabel() {
        return fetch(versionUrl() + '?t=' + Date.now(), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache', Pragma: 'no-cache' },
        })
          .then(function (res) { return res.ok ? res.json() : null; })
          .then(function (data) { return data ? releaseLabel(data) : null; });
      }

      function runVersionGate() {
        if (window.__gpOAuth && window.__gpOAuth.isOAuthReturn()) {
          startBootstrap();
          return Promise.resolve();
        }
        return fetchReleaseLabel().then(function (label) {
          if (!label) return startBootstrap();

          var prev = null;
          try { prev = localStorage.getItem(VERSION_KEY); } catch (e) {}

          if (prev && prev !== label) {
            return withTimeout(purgeClient(), 3000).then(function () {
              try { localStorage.setItem(VERSION_KEY, label); } catch (e) {}
              var url = new URL(window.location.href);
              url.searchParams.set('_gp', String(Date.now()));
              window.location.replace(url.toString());
            });
          }
          try {
            if (!prev || prev !== label) localStorage.setItem(VERSION_KEY, label);
          } catch (e) {}
          startBootstrap();
        });
      }

      if (isLocalDev()) {
        startBootstrap();
        return;
      }

      if (window.__gpOAuth && window.__gpOAuth.isOAuthReturn()) {
        startBootstrap();
        return;
      }

      var migrated = false;
      try { migrated = !!localStorage.getItem(MIGRATION_KEY); } catch (e) {}

      if (!migrated) {
        try { localStorage.setItem(MIGRATION_KEY, '1'); } catch (e) {}
        // Do not block first paint on SW/cache purge (incognito can hang here).
        withTimeout(purgeClient(), 3000).finally(startBootstrap);
        return;
      }

      runVersionGate().catch(function () { startBootstrap(); });
      setTimeout(startBootstrap, 4000);
    })();
  </script>
</body>
</html>
